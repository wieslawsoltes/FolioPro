name: Browser rendering regression
on:
  workflow_call:
    inputs:
      url:
        type: string
        default: ''
      cases:
        type: string
        default: normal,delayed-shader,delayed-pipeline,no-webgpu,pipeline-rejected
      artifact-name:
        type: string
        default: rendering-regression
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0 Pillow==12.0.0
      - run: python -m playwright install --with-deps --no-shell chromium
      - run: npm run build
      - name: Verify real WebGPU and Canvas fallback pixels
        env:
          FOLIO_HEADED: '1'
          FOLIO_URL: ${{ inputs.url }}
          FOLIO_CASES: ${{ inputs.cases }}
        run: xvfb-run -a python tests/browser_rendering.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact-name }}
          path: tests/out/rendering/
          if-no-files-found: warn
